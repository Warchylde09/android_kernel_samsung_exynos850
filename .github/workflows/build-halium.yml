name: Build Halium Kernel (SM-A217F)

on:
  push:
    branches: [ "lineage-24.0" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 dwarves device-tree-compiler lz4 xz-utils

      - name: Download Android Clang & GCC Toolchains
        run: |
          mkdir -p /tmp/toolchains/clang /tmp/toolchains/gcc64 /tmp/toolchains/gcc32
          GH="https://github.com"
          git clone --depth=1 "$GH/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b" /tmp/toolchains/clang
          git clone --depth=1 -b lineage-19.1 "$GH/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9" /tmp/toolchains/gcc64
          git clone --depth=1 -b lineage-19.1 "$GH/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9" /tmp/toolchains/gcc32

      - name: Merge Defconfig & Verify Halium Config
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="/tmp/toolchains/clang/bin:/tmp/toolchains/gcc64/bin:/tmp/toolchains/gcc32/bin:$PATH"
          make O=out ARCH=arm64 exynos850-a21snsxx_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/halium.config
          make O=out ARCH=arm64 olddefconfig
          grep -E "CONFIG_NAMESPACES|CONFIG_USER_NS|CONFIG_CGROUPS|CONFIG_SECURITY_APPARMOR|CONFIG_USB_CONFIGFS_RNDIS|CONFIG_BLK_DEV_LOOP" out/.config

      - name: Compile Kernel Image & DTBO
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="/tmp/toolchains/clang/bin:/tmp/toolchains/gcc64/bin:/tmp/toolchains/gcc32/bin:$PATH"
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            Image dtbo.img

      - name: Collect Build Artifacts
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/
          cp out/arch/arm64/boot/dtbo.img artifacts/ || true
          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} artifacts/ \;
          cp out/.config artifacts/merged_config

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: halium-kernel-a21s
          path: artifacts/
